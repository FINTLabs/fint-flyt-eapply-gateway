fint:
    application-id: fint-flyt-eapply-gateway

logging:
    level:
        no.novari.cache.ehcache.FintEhCacheEventLogger: WARN
        no.novari.flyt.webresourceserver: DEBUG

server:
    error:
        include-message: always
    max-http-request-header-size: 40KB

spring:
    profiles:
        include:
            - flyt-kafka
            - flyt-logging
            - flyt-web-resource-server
            - flyt-file-client

    output:
        ansi:
            enabled: always

springdoc:
    swagger-ui:
        path: ${novari.flyt.eapply.swagger.base-path:${novari.flyt.eapply.api.base-path:/api/eapply}}/swagger-ui
    api-docs:
        path: ${novari.flyt.eapply.swagger.base-path:${novari.flyt.eapply.api.base-path:/api/eapply}}/v3/api-docs
