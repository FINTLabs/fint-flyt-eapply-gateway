apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: innlandetfylke-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-eapply-gateway_innlandetfylke_no
      fintlabs.no/org-id: innlandetfylke.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "innlandetfylke-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "innlandetfylke.no"
      - op: replace
        path: "/spec/ingress/basePath"
        value: "/beta/innlandetfylke-no/api/eapply"
      - op: replace
        path: "/spec/probes/startup/path"
        value: "/beta/innlandetfylke-no/actuator/health"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/beta/innlandetfylke-no/actuator/health/readiness"
      - op: replace
        path: "/spec/probes/liveness/path"
        value: "/beta/innlandetfylke-no/actuator/health/liveness"
      - op: add
        path: "/spec/env/-"
        value:
          name: novari.kafka.topic.org-id
          value: "innlandetfylke-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: server.servlet.context-path
          value: "/beta/innlandetfylke-no"
    target:
      kind: Application
      name: fint-flyt-eapply-gateway
