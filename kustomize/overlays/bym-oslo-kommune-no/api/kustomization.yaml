apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bym-oslo-kommune-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-eapply-gateway_bym_oslo_kommune_no
      fintlabs.no/org-id: bym.oslo.kommune.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "bym-oslo-kommune-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "bym.oslo.kommune.no"
      - op: add
        path: "/spec/imagePullSecrets"
        value:
          - ghcr
      - op: replace
        path: "/spec/ingress/basePath"
        value: "/bym-oslo-kommune-no/api/eapply"
      - op: replace
        path: "/spec/probes/startup/path"
        value: "/bym-oslo-kommune-no/actuator/health"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/bym-oslo-kommune-no/actuator/health/readiness"
      - op: replace
        path: "/spec/probes/liveness/path"
        value: "/bym-oslo-kommune-no/actuator/health/liveness"
      - op: add
        path: "/spec/env/-"
        value:
          name: novari.kafka.topic.org-id
          value: "bym-oslo-kommune-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: server.servlet.context-path
          value: "/bym-oslo-kommune-no"
    target:
      kind: Application
      name: fint-flyt-eapply-gateway
  - patch: |-
      - op: add
        path: "/spec/itemPath"
        value: "vaults/aks-api-vault/items/fint-flyt-eapply-oauth2-client-bym-oslo-kommune-no"
    target:
      kind: OnePasswordItem
      name: fint-flyt-eapply-oauth2-client
